name: Refresh Cloudflare curator

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curator-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    env:
      CURATOR_CONFIG_NAMESPACE_ID: 99c03154219743e68952b9ff860545a6
      R2_BUCKET: iptvwatchdog-curator

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and publish curated files
        run: npm run refresh:action
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
          EPG_URL: ${{ secrets.EPG_URL }}
          PLAYLIST_TOKEN: ${{ secrets.PLAYLIST_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.CURATOR_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
